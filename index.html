<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06182a" />
<title>AIU Compass — multilingual campus concierge</title>
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="manifest.webmanifest" />
</head>
<body>

<header>
  <div class="brand"><b>AIU Compass</b></div>
  <div class="langbar">
    <span class="langlabel" id="langLabel">ภาษา</span>
    <div class="chips" id="chips" role="group" aria-labelledby="langLabel"></div>
  </div>
</header>

<main>
  <section id="stage">
    <canvas id="map" aria-label="Campus map"></canvas>
    <div class="origin" id="originBox">
      <label for="fromSel" id="fromLabel">Starting from</label>
      <select id="fromSel"></select>
    </div>
    <div class="routeNote" id="routeNote"></div>
    <div class="stageNote" id="stageNote"></div>
    <div class="offlineBar" id="offlineBar"></div>
  </section>

  <section id="panel">
    <div class="micRow">
      <button class="mic" id="mic" aria-label="Tap to speak">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" fill="none" stroke="#04231a" stroke-width="2.1" stroke-linecap="round">
          <path d="M12 3.5a3.2 3.2 0 0 1 3.2 3.2v5.1a3.2 3.2 0 1 1-6.4 0V6.7A3.2 3.2 0 0 1 12 3.5Z" fill="#04231a" stroke="none"/>
          <path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0M12 17.6V21M8.6 21h6.8"/>
        </svg>
      </button>
      <div class="hint">
        <b id="hintTitle">แตะแล้วพูด</b><br />
        <span id="hintTry">ลองพูดว่า “ห้อง IT208 อยู่ไหน”</span>
      </div>
    </div>

    <div class="transcript" id="transcript"></div>

    <div class="typed">
      <input id="typedInput" type="text" inputmode="text" autocomplete="off"
             placeholder="…หรือพิมพ์คำถาม" />
      <button id="askBtn" type="button">ถาม</button>
    </div>

    <div class="suggestions" id="suggestions"></div>

    <div class="answer" id="answer">
      <div class="lang" id="answerLang">Answer</div>
      <div class="main" id="answerMain"></div>
      <div class="secondary" id="answerSecondary"></div>
      <div class="note" id="answerNote"></div>
      <div class="note voice" id="voiceNote"></div>
      <div class="actions">
        <button class="showMe" id="showMe" type="button">Show me on the map</button>
        <button class="ghost" id="speakBtn" type="button">Replay</button>
      </div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
